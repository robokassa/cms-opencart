name: Build OCMOD ZIP and Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencart-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read extension versions
        id: versions
        shell: bash
        run: |
          OC3_VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' 'OpenCart 3.x/install.xml')"
          OC4_VERSION="$(jq -r '.version' 'OpenCart 4.x/upload/robokassa/install.json')"

          test -n "$OC3_VERSION"
          test -n "$OC4_VERSION"
          test "$OC4_VERSION" != "null"

          echo "oc3=$OC3_VERSION" >> "$GITHUB_OUTPUT"
          echo "oc4=$OC4_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=opencart-oc3-v${OC3_VERSION}-oc4-v${OC4_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.versions.outputs.tag }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Increase the extension version before publishing."
            exit 1
          fi

      - name: Build OpenCart 3 archive
        shell: bash
        run: |
          mkdir -p release/opencart-3
          cd 'OpenCart 3.x'
          zip -r ../release/opencart-3/robokassa-opencart-3.ocmod.zip upload install.xml README.md -x '*.DS_Store'

      - name: Build OpenCart 4 archive
        shell: bash
        run: |
          mkdir -p release/opencart-4
          cd 'OpenCart 4.x/upload/robokassa'
          zip -r ../../../release/opencart-4/robokassa-opencart-4.ocmod.zip admin catalog system install.json README.md -x '*.DS_Store'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.tag }}
          name: Robokassa for OpenCart — OC3 v${{ steps.versions.outputs.oc3 }} / OC4 v${{ steps.versions.outputs.oc4 }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/opencart-3/robokassa-opencart-3.ocmod.zip
            release/opencart-4/robokassa-opencart-4.ocmod.zip
